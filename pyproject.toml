[project]
name = "your-daily-muse"
version = "1.0.0"
description = "Your Daily Muse — Autonomous Verification-First Personalized Newspaper built with Google ADK and Meta Muse Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.12",
    "google-adk>=0.1.0",
    "litellm>=1.52.0",
    "trafilatura>=1.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
